app:
  name: "Sovereign AI Workbench"
  version: "1.0.0-prototype"
  subtitle: "Private Data. Local Intelligence. Real Work."
  project_id: "SIH26117"

# --- Paths ---
paths:
  workspace: "workspace"
  uploads: "workspace/uploads"
  outputs: "workspace/outputs"
  temporary: "workspace/temporary"
  knowledge_base: "knowledge_base"
  demo_data: "demo_data"
  logs: "logs"
  audit_log: "logs/audit.jsonl"
  chroma_db: "workspace/chroma_db"

# --- Security ---
security:
  air_gapped_mode: true
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "::1"
  block_external_llm_apis: true
  sandbox_network_disabled: true
  log_all_operations: true

# --- Ollama ---
ollama:
  base_url: "http://localhost:11434"
  timeout: 300
  max_retries: 3

# --- Document Processing ---
document:
  max_pdf_pages: 50
  ocr_dpi: 200
  chunk_size: 800
  chunk_overlap: 100
  min_text_length_for_digital: 100   # chars per page; below = treat as scanned

# --- RAG ---
rag:
  top_k: 5
  similarity_threshold: 0.3
  collection_name: "sih26117_knowledge"

# --- Docker Sandbox ---
sandbox:
  image: "python:3.11-slim"
  timeout_seconds: 30
  memory_limit: "256m"
  cpu_quota: 50000
  network_disabled: true
  workspace_mount: "/sandbox"

# --- Agent ---
agent:
  max_iterations: 10
  stream_thoughts: false
  show_reasoning: false

# --- UI ---
ui:
  page_icon: "🔒"
  layout: "wide"
  theme: "dark"
